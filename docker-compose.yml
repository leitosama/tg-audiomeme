services:
  bot:
    # Default policy: pull the published image. Rebuild locally with `--build`.
    image: ghcr.io/leitosama/tg-audiomeme:latest
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      TG_API_URL: ${TG_API_URL:-}
      TG_API_TIMEOUT: ${TG_API_TIMEOUT:-30}
      TG_LONG_POLL_TIMEOUT: ${TG_LONG_POLL_TIMEOUT:-25}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./db:/app/db
