<!doctype html>
<!-- The Converter: turns an audio or video file into a meme's voice message or video
     note on the admin's device, then hands it back to /add (ADR-0004). -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Загрузить мем</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <label class="stage" id="stage">
        <input type="file" id="file" accept="audio/*,video/*" class="visually-hidden" />
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-track" cx="50" cy="50" r="48" />
          <circle class="ring-fill" id="ring" cx="50" cy="50" r="48" pathLength="100" />
        </svg>
        <span class="disc">
          <video id="preview" muted playsinline loop hidden></video>
          <span class="glyph" id="glyph" aria-hidden="true">+</span>
        </span>
      </label>

      <p class="caption" id="caption">Выбери аудио или видео до 100 МБ</p>

      <fieldset class="choice" id="choice" hidden>
        <legend class="visually-hidden">Что сделать из видео</legend>
        <label><input type="radio" name="kind" value="videoNote" checked /><span>Кружок</span></label>
        <label><input type="radio" name="kind" value="voice" /><span>Только звук</span></label>
      </fieldset>

      <p class="note" id="note" hidden>Видео будет обрезано до квадрата по центру</p>
      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="actions">
        <button type="button" class="primary" id="action" hidden>Конвертировать</button>
        <button type="button" class="link" id="repick" hidden>Выбрать другой файл</button>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
